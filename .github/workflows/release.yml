name: Release SwitchControl

# Triggered by pushing a version tag: git tag v1.2.3 && git push origin v1.2.3
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'       # stable:  v1.2.3
      - 'v[0-9]+.[0-9]+.[0-9]+-beta*'  # beta:    v1.2.3-beta.1

# ── What this workflow does ───────────────────────────────────────────────────
# 1. Validates version sync (root/package.json == electron/package.json)
# 2. Syncs tag version into electron/package.json
# 3. Builds the React frontend
# 4. Builds the Windows Electron installer via electron-builder
# 5. Generates latest.yml metadata (SHA-512 + size)
# 6. Validates all artifacts before any upload
# 7. Uploads to Cloudflare R2 — installer first, metadata last
#
# ── What this workflow does NOT do ───────────────────────────────────────────
# - Does NOT create GitHub Releases for update delivery
# - Does NOT upload update artifacts to GitHub Releases
# - Does NOT reference GitHub as an update metadata source
#
# The only update delivery backend is https://releases.switchcontrol.org (R2).
# GitHub Releases must never be the source of truth for electron-updater.
# If you want a GitHub Release for marketing/changelogs, add a separate job
# that does not affect update infrastructure.

permissions:
  contents: read  # read-only; we do not create GitHub Releases here

jobs:
  release-windows:
    name: Build & Upload to R2
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      # ── 1. Checkout ─────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 2. Node.js setup ────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ── 3. Extract version from tag ─────────────────────────────────────────
      - name: Extract version from tag
        id: version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Release version: $VERSION"

      # ── 4. Sync version into electron/package.json ──────────────────────────
      # The tag is the single source of truth for version at release time.
      # Both root/package.json and electron/package.json are updated to match.
      - name: Sync version into packages
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          node -e "
            const fs = require('fs');
            ['package.json', 'electron/package.json'].forEach(f => {
              const p = JSON.parse(fs.readFileSync(f, 'utf8'));
              p.version = '$VERSION';
              fs.writeFileSync(f, JSON.stringify(p, null, 2) + '\n');
              console.log(f + ' version set to ' + p.version);
            });
          "

      # ── 5. Validate version sync ─────────────────────────────────────────────
      # Fail fast if the two package.json files still differ after sync.
      - name: Validate version sync
        run: node electron/scripts/sync-version.js

      # ── 6. Install root dependencies ────────────────────────────────────────
      - name: Install root dependencies
        run: npm ci

      # ── 7. Build frontend ───────────────────────────────────────────────────
      - name: Build React frontend
        run: npm run build
        env:
          NODE_ENV: production

      # ── 8. Copy frontend dist into electron/dist-frontend ───────────────────
      - name: Copy frontend to electron
        shell: pwsh
        run: |
          if (Test-Path "electron/dist-frontend") {
            Remove-Item "electron/dist-frontend" -Recurse -Force
          }
          # Adjust source path to match your actual vite output directory
          if (Test-Path "dist/public") {
            Copy-Item "dist/public" "electron/dist-frontend" -Recurse
          } elseif (Test-Path "dist-frontend") {
            Copy-Item "dist-frontend" "electron/dist-frontend" -Recurse
          } else {
            Write-Error "ERROR: Could not find frontend build output. Looked for dist/public and dist-frontend."
            exit 1
          }
          Write-Host "Frontend dist-frontend contents:"
          Get-ChildItem "electron/dist-frontend" | Select-Object -First 20

      # ── 9. Install Electron dependencies ────────────────────────────────────
      - name: Install Electron dependencies
        working-directory: electron
        run: npm ci

      # ── 10. Build native modules (optional) ─────────────────────────────────
      - name: Build native modules
        working-directory: electron
        shell: bash
        run: |
          if [ -f "scripts/build-native.js" ]; then
            node scripts/build-native.js || echo "Native build skipped (non-fatal)"
          fi

      # ── 11. Build NSIS installer ─────────────────────────────────────────────
      # --publish never: electron-builder must NOT push to any publish target.
      # Upload is handled manually by release.js so we control the exact order.
      - name: Build Windows installer
        working-directory: electron
        run: npx electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # ── 12. Generate latest.yml ──────────────────────────────────────────────
      # Produces electron/dist/latest.yml and electron/dist/stable.yml
      - name: Generate latest.yml metadata
        working-directory: electron
        run: node scripts/generate-latest-yml.js

      # ── 13. Validate artifacts ───────────────────────────────────────────────
      # Fail before uploading anything if artifacts are missing or malformed.
      # A partial upload is worse than a failed build.
      - name: Validate release artifacts
        working-directory: electron
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $distDir = "dist"
          Write-Host "Validating artifacts for version: $version"

          $exe = Get-ChildItem "$distDir\*.exe" -Exclude "*.exe.blockmap" | Select-Object -First 1
          if (-not $exe) { Write-Error "No installer .exe found"; exit 1 }
          if ($exe.Length -eq 0) { Write-Error "Installer is 0 bytes"; exit 1 }
          Write-Host "OK   installer : $($exe.Name)  ($([math]::Round($exe.Length/1MB,1)) MB)"

          $yml = "$distDir\latest.yml"
          if (-not (Test-Path $yml)) { Write-Error "latest.yml not found"; exit 1 }
          $ymlContent = Get-Content $yml -Raw
          if (-not ($ymlContent -match "version: $version")) {
            Write-Error "latest.yml version mismatch — expected: $version"; exit 1
          }
          if (-not ($ymlContent -match "sha512:")) {
            Write-Error "latest.yml missing sha512 field"; exit 1
          }
          if (-not ($ymlContent -match [regex]::Escape($exe.Name))) {
            Write-Error "latest.yml does not reference installer: $($exe.Name)"; exit 1
          }
          Write-Host "OK   latest.yml : version=$version sha512=present installer=referenced"
          Write-Host "All validations passed."

      # ── 14. Upload to R2 ────────────────────────────────────────────────────
      # release.js handles upload order: installer → blockmap → stable.yml → latest.yml
      # latest.yml is uploaded LAST so clients never see metadata before the binary.
      - name: Upload to Cloudflare R2
        working-directory: electron
        run: node scripts/release.js
        env:
          R2_ACCOUNT_ID:        ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET:            ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_URL:        https://releases.switchcontrol.org

      # ── 15. Summary ─────────────────────────────────────────────────────────
      - name: Release summary
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          Write-Host ""
          Write-Host "======================================================="
          Write-Host "  SwitchControl v$version — Release complete"
          Write-Host "  Update host  : https://releases.switchcontrol.org"
          Write-Host "  Metadata     : https://releases.switchcontrol.org/latest.yml"
          Write-Host "  Channel      : stable"
          Write-Host "  Provider     : R2 generic (no GitHub Releases)"
          Write-Host "======================================================="
