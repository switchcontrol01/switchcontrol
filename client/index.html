<!DOCTYPE html>
<html lang="en" style="background:#070b14;color-scheme:dark;height:100%;width:100%;overflow:hidden;">
  <head>
    <meta name="google-site-verification" content="7Go-YIR3WALNYY6u19nKMEUG1nSTgugkNssIoYuwEL8" />
    <style>
      html, body, #root {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #070b14 !important;
        background-color: #070b14 !important;
      }

      html.sc-web,
      html.sc-web body,
      html.sc-web #root {
        overflow: auto !important;
        height: auto !important;
      }

      #boot-shell {
        position: fixed;
        inset: 0;
        z-index: 999999;
        background: #070b14;
        pointer-events: none;
      }
    </style>

    <script>
      document.documentElement.style.background = '#070b14';
      document.documentElement.style.colorScheme = 'dark';
      if (!(window.electronAPI || navigator.userAgent.indexOf('Electron') !== -1)) {
        document.documentElement.classList.add('sc-web');
      }
    </script>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />

    <title>SwitchControl - Professional Gaming Optimization for Windows</title>
    <meta name="description" content="Unlock your PC's true potential with professional-grade Windows optimization. Lower latency, smoother frames, better consistency for competitive gaming." />
    <meta property="og:title" content="SwitchControl - Professional Gaming Optimization" />
    <meta property="og:description" content="Lower latency, smoother frames, better consistency. Professional Windows optimization for competitive gamers." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://switchcontrol.org" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@replit" />
    <meta name="twitter:title" content="SwitchControl - Professional Gaming Optimization" />
    <meta name="twitter:description" content="Lower latency, smoother frames, better consistency. Professional Windows optimization for competitive gamers." />
    <meta name="keywords" content="gaming optimization, Windows tweaks, latency reduction, FPS boost, competitive gaming, system optimization" />
    <meta property="og:image" content="/og-image.png" />
    <meta name="twitter:image" content="/og-image.png" />
    <meta name="theme-color" content="#8b5cf6" />
    <link rel="canonical" href="https://switchcontrol.org/" />

    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="icon" type="image/vnd.microsoft.icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="192x192" href="/android-chrome-192x192.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- Non-blocking font load via Google Fonts CDN.
         Inter + JetBrains Mono were previously bundled via @fontsource npm packages
         but those packages reliably failed to install on Windows (npm reports
         "up to date" while the folder is absent). CDN is more reliable cross-platform
         and Electron caches the response after the first run.
         media="print" + onload trick prevents render-blocking in both Electron and web. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Playfair+Display:wght@400;500;600;700;800;900&display=swap" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Playfair+Display:wght@400;500;600;700;800;900&display=swap"></noscript>
  </head>
  <body style="margin:0;padding:0;background:#070b14;overflow:hidden;height:100%;width:100%;">

    <!-- Pure dark boot shell — covers the window until React's first frame.
         No animations, no blur, no opacity tricks. Solid #070b14 only.
         Removed by main.tsx via double-rAF after React mounts. -->
    <div id="boot-shell"></div>

    <div id="root" style="background:#070b14;height:100%;width:100%;"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
